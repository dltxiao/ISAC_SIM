<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470"><style>text{font-family:"NotoSC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><rect width="1240" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" fill="#111827" text-anchor="start" font-weight="bold"  dominant-baseline="middle">图 3-3  A3 跨层隐蔽攻击（雷达回波渐偏）</text><text x="24" y="60" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal"  dominant-baseline="middle">攻击者 → 回波距离线性渐偏 → 点迹同步偏移 → 目标列表仍为真值 → 多帧残差</text><rect x="72.0" y="100" width="166" height="126" fill="#dc2626" rx="10" fill-opacity="0.07"/><rect x="72.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#dc2626" stroke-width="1.6"/><rect x="72.0" y="100" width="166" height="4" fill="#dc2626" rx="2"/><text x="155.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">攻击者</text><text x="155.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">回波距离渐偏</text><text x="155.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">0.8–3.0 m / duration</text><line x1="240.0" y1="163" x2="256.0" y2="163" stroke="#dc2626" stroke-width="2.2"/><polygon points="256.0,163 247.0,158.1 247.0,167.9" fill="#dc2626"/><rect x="258.0" y="100" width="166" height="126" fill="#0d9488" rx="10" fill-opacity="0.07"/><rect x="258.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="258.0" y="100" width="166" height="4" fill="#0d9488" rx="2"/><text x="341.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">雷达回波</text><text x="341.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">range += bias·t/T</text><text x="341.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">所有传感器</text><rect x="392.0" y="74" width="32" height="20" fill="#dc2626" rx="10"/><text x="408.0" y="84" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">注入</text><line x1="426.0" y1="163" x2="442.0" y2="163" stroke="#94a3b8" stroke-width="1.6"/><polygon points="442.0,163 433.0,158.1 433.0,167.9" fill="#94a3b8"/><rect x="444.0" y="100" width="166" height="126" fill="#0d9488" rx="10" fill-opacity="0.07"/><rect x="444.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#0d9488" stroke-width="1.6"/><rect x="444.0" y="100" width="166" height="4" fill="#0d9488" rx="2"/><text x="527.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">点迹</text><text x="527.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">由被篡改回波派生</text><text x="527.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">range 同步偏移</text><line x1="612.0" y1="163" x2="628.0" y2="163" stroke="#94a3b8" stroke-width="1.6"/><polygon points="628.0,163 619.0,158.1 619.0,167.9" fill="#94a3b8"/><rect x="630.0" y="100" width="166" height="126" fill="#059669" rx="10" fill-opacity="0.07"/><rect x="630.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#059669" stroke-width="1.6"/><rect x="630.0" y="100" width="166" height="4" fill="#059669" rx="2"/><text x="713.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">目标列表</text><text x="713.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">仍为真值</text><text x="713.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">三层出现稳定残差</text><line x1="798.0" y1="163" x2="814.0" y2="163" stroke="#94a3b8" stroke-width="1.6"/><polygon points="814.0,163 805.0,158.1 805.0,167.9" fill="#94a3b8"/><rect x="816.0" y="100" width="166" height="126" fill="#d97706" rx="10" fill-opacity="0.07"/><rect x="816.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#d97706" stroke-width="1.6"/><rect x="816.0" y="100" width="166" height="4" fill="#d97706" rx="2"/><text x="899.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">控制</text><text x="899.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">60% 时小指令</text><text x="899.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">1.2 m/s²，掩盖意图</text><line x1="984.0" y1="163" x2="1000.0" y2="163" stroke="#94a3b8" stroke-width="1.6"/><polygon points="1000.0,163 991.0,158.1 991.0,167.9" fill="#94a3b8"/><rect x="1002.0" y="100" width="166" height="126" fill="#2563eb" rx="10" fill-opacity="0.07"/><rect x="1002.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#2563eb" stroke-width="1.6"/><rect x="1002.0" y="100" width="166" height="4" fill="#2563eb" rx="2"/><text x="1085.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">遥测 / 链路</text><text x="1085.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">保持正常</text><text x="1085.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">单帧低于门限</text><text x="40" y="270" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold"  dominant-baseline="middle">可观测证据</text><rect x="140" y="258" width="127.12" height="24" fill="#1d4ed8" rx="12" fill-opacity="0.1"/><rect x="140" y="258" width="127.12" height="24" fill="none" rx="12" stroke="#1d4ed8" stroke-width="1"/><text x="203.56" y="270" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">radar_range_bias</text><rect x="277.12" y="258" width="154.4" height="24" fill="#1d4ed8" rx="12" fill-opacity="0.1"/><rect x="277.12" y="258" width="154.4" height="24" fill="none" rx="12" stroke="#1d4ed8" stroke-width="1"/><text x="354.32" y="270" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">brake_without_hazard</text><text x="40" y="312" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold"  dominant-baseline="middle">包络判据</text><rect x="140" y="300" width="99.84" height="24" fill="#b45309" rx="12" fill-opacity="0.1"/><rect x="140" y="300" width="99.84" height="24" fill="none" rx="12" stroke="#b45309" stroke-width="1"/><text x="189.92000000000002" y="312" font-size="11" fill="#b45309" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">bias ≥ 1.0 m</text><text x="40" y="358" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold"  dominant-baseline="middle">检测规则</text><text x="140" y="358" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal"  dominant-baseline="middle">仅雷达规则：幅度 0.15 检出 17.5%，0.30 为 70%，≥0.50 为 100%；控制规则全幅度命中。</text></svg>