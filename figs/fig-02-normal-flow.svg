<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840"><style>text{font-family:"NotoSC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><rect width="1240" height="840" fill="#ffffff"/><text x="24" y="34" font-size="20" fill="#111827" text-anchor="start" font-weight="bold"  dominant-baseline="middle">图 2  正常状态下的数据流与闭环</text><text x="24" y="60" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal"  dominant-baseline="middle">一个 0.05 s 步内：SUMO 推进 → 感知/通信/接入 → ADAS → 任务/图；观测落盘并送检测器；真值与检测隔离</text><text x="24" y="84" font-size="11" fill="#b45309" text-anchor="start" font-weight="normal"  dominant-baseline="middle">正常态包含难负样本：跟驰换道、信号灯停车、真实急刹、大车遮挡、小区切换、GNSS 城市峡谷退化——它们都会让单条规则"看起来像攻击"</text><rect x="80" y="110" width="1080" height="72" fill="#334155" rx="10" fill-opacity="0.07"/><rect x="80" y="110" width="1080" height="72" fill="none" rx="10" stroke="#334155" stroke-width="1.6"/><rect x="80" y="110" width="1080" height="4" fill="#334155" rx="2"/><text x="620.0" y="136.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">SUMO（TraCI）— 唯一世界状态</text><text x="620.0" y="166.5" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">车辆位姿 / 速度 / 类型 / 车道 / 信号灯；步长 0.05 s；固定 seed</text><rect x="80" y="230" width="330" height="176" fill="#059669" rx="10" fill-opacity="0.07"/><rect x="80" y="230" width="330" height="176" fill="none" rx="10" stroke="#059669" stroke-width="1.6"/><rect x="80" y="230" width="330" height="4" fill="#059669" rx="2"/><text x="245.0" y="256.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">感知层</text><text x="245.0" y="286.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">回波 echo：每目标/帧（10–20 Hz）</text><text x="245.0" y="302.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">点迹 track：由回波派生</text><text x="245.0" y="318.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">目标列表 objects：相机等价（每帧）</text><text x="245.0" y="333.75" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">GNSS 10 Hz；帧号/时钟随帧输出</text><line x1="620" y1="182" x2="245.0" y2="228" stroke="#94a3b8" stroke-width="1.4"/><polygon points="245.0,228 254.5,231.8 253.3,222.0" fill="#94a3b8"/><rect x="440" y="230" width="360" height="176" fill="#2563eb" rx="10" fill-opacity="0.07"/><rect x="440" y="230" width="360" height="176" fill="none" rx="10" stroke="#2563eb" stroke-width="1.6"/><rect x="440" y="230" width="360" height="4" fill="#2563eb" rx="2"/><text x="620.0" y="256.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">通信层</text><text x="620.0" y="286.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">CAM 10 Hz×DCC（紧急 20 Hz）</text><text x="620.0" y="302.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">CPM 10 Hz；DENM 事件；SPaT 1 Hz</text><text x="620.0" y="318.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">CBR = 0.92·offered/1200 + jam</text><text x="620.0" y="333.75" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">PER/时延由 CBR 推导；丢包也落盘</text><line x1="620" y1="182" x2="620.0" y2="228" stroke="#94a3b8" stroke-width="1.4"/><polygon points="620.0,228 625.0,219.0 615.0,219.0" fill="#94a3b8"/><rect x="830" y="230" width="330" height="176" fill="#7c3aed" rx="10" fill-opacity="0.07"/><rect x="830" y="230" width="330" height="176" fill="none" rx="10" stroke="#7c3aed" stroke-width="1.6"/><rect x="830" y="230" width="330" height="4" fill="#7c3aed" rx="2"/><text x="995.0" y="256.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">接入 / 认证</text><text x="995.0" y="286.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">attach / handover（12–40 s）</text><text x="995.0" y="302.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">cert 6–12 s 轮换；pseudonym</text><text x="995.0" y="318.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">fingerprint 1 Hz：CFO/IQ/RSSI</text><text x="995.0" y="333.75" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">指纹由设备固有偏差决定</text><line x1="620" y1="182" x2="995.0" y2="228" stroke="#94a3b8" stroke-width="1.4"/><polygon points="995.0,228 986.7,222.0 985.5,231.8" fill="#94a3b8"/><text x="652" y="206" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal"  dominant-baseline="middle">几何投影 + 噪声</text><rect x="80" y="450" width="560" height="150" fill="#d97706" rx="10" fill-opacity="0.07"/><rect x="80" y="450" width="560" height="150" fill="none" rx="10" stroke="#d97706" stroke-width="1.6"/><rect x="80" y="450" width="560" height="4" fill="#d97706" rx="2"/><text x="360.0" y="476.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">控制层：ADAS（TTC / AEB）</text><text x="360.0" y="506.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">对同车道 2–60 m 目标：TTC = 纵向距离 / 相对速度</text><text x="360.0" y="522.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">TTC &lt; 2.5 s → 制动指令（减速度 3 m/s²，反应延迟 120 ms）</text><text x="360.0" y="538.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">执行器：sumo.slow_down() 回写 SUMO → 真实减速/排队</text><text x="360.0" y="553.75" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">正常场景下只在"真有前车"时触发</text><rect x="670" y="450" width="490" height="150" fill="#0891b2" rx="10" fill-opacity="0.07"/><rect x="670" y="450" width="490" height="150" fill="none" rx="10" stroke="#0891b2" stroke-width="1.6"/><rect x="670" y="450" width="490" height="4" fill="#0891b2" rx="2"/><text x="915.0" y="476.0" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">任务层 / 图快照</text><text x="915.0" y="506.5" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">task 1 Hz：航路点、阶段、偏差、时限</text><text x="915.0" y="522.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">graph 10 Hz：覆盖边、Uu 边</text><text x="915.0" y="538.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">供 STGNN 与攻击链聚合使用</text><line x1="400" y1="406" x2="300" y2="448" stroke="#94a3b8" stroke-width="1.4"/><polygon points="300,448 310.2,449.1 306.4,440.0" fill="#94a3b8"/><text x="412" y="422" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal"  dominant-baseline="middle">消费被篡改后的目标列表</text><path d="M 80 525 L 46 525 L 46 146" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><line x1="46" y1="146" x2="78" y2="146" stroke="#d97706" stroke-width="2"/><polygon points="78,146 69.0,141.1 69.0,150.9" fill="#d97706"/><g transform="rotate(-90 34 336)"><text x="34" y="336" font-size="10" fill="#d97706" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">执行器回写 SUMO</text></g><rect x="80" y="650" width="500" height="66" fill="#475569" rx="10" fill-opacity="0.07"/><rect x="80" y="650" width="500" height="66" fill="none" rx="10" stroke="#475569" stroke-width="1.6"/><rect x="80" y="650" width="500" height="4" fill="#475569" rx="2"/><text x="330.0" y="676.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">观测流落盘：JSONL / Parquet</text><text x="330.0" y="705.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">18 类流；ts_ns（仿真时间）+ t_wall_ns（墙钟）</text><rect x="620" y="650" width="540" height="66" fill="#0f766e" rx="10" fill-opacity="0.07"/><rect x="620" y="650" width="540" height="66" fill="none" rx="10" stroke="#0f766e" stroke-width="1.6"/><rect x="620" y="650" width="540" height="4" fill="#0f766e" rx="2"/><text x="890.0" y="676.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">参考检测器（在线，只读观测流）</text><text x="890.0" y="705.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">规则：多源互证 / 残差 / 位置跳变 / 链路 / 控制合理性</text><line x1="360" y1="600" x2="330" y2="648" stroke="#94a3b8" stroke-width="1.4"/><polygon points="330,648 339.0,643.0 330.6,637.7" fill="#94a3b8"/><line x1="740" y1="600" x2="890" y2="648" stroke="#94a3b8" stroke-width="1.4"/><polygon points="890,648 882.9,640.5 879.9,650.0" fill="#94a3b8"/><rect x="80" y="748" width="1080" height="54" fill="#6b7280" rx="8" fill-opacity="0.05"/><rect x="80" y="748" width="1080" height="54" fill="none" rx="8" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 5"/><text x="104" y="775" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold"  dominant-baseline="middle">真值 truth/events.jsonl（事件 / 阶段 / 参数）</text><text x="470" y="775" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal"  dominant-baseline="middle">—— 仅评估与运维对账使用；检测器不可读（有静态断言）</text><text x="1080" y="775" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">×</text><text x="1112" y="775" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">隔离</text></svg>