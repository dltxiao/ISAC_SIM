<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470"><style>text{font-family:"NotoSC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif;}</style><rect width="1240" height="470" fill="#ffffff"/><text x="24" y="34" font-size="20" fill="#111827" text-anchor="start" font-weight="bold"  dominant-baseline="middle">图 3-4  A4 双因素仿冒攻击</text><text x="24" y="60" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal"  dominant-baseline="middle">攻击者 → 克隆伪名 + 复制信道指纹 → 以受害者身份发消息 → 位置/定位矛盾</text><rect x="72.0" y="100" width="166" height="126" fill="#dc2626" rx="10" fill-opacity="0.07"/><rect x="72.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#dc2626" stroke-width="1.6"/><rect x="72.0" y="100" width="166" height="4" fill="#dc2626" rx="2"/><text x="155.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">攻击者</text><text x="155.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">克隆双因素</text><text x="155.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">伪名 + 指纹</text><line x1="240.0" y1="163" x2="256.0" y2="163" stroke="#dc2626" stroke-width="2.2"/><polygon points="256.0,163 247.0,158.1 247.0,167.9" fill="#dc2626"/><rect x="258.0" y="100" width="166" height="126" fill="#7c3aed" rx="10" fill-opacity="0.07"/><rect x="258.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="258.0" y="100" width="166" height="4" fill="#7c3aed" rx="2"/><text x="341.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">auth.cert</text><text x="341.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">clone 事件</text><text x="341.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">与受害者同伪名</text><rect x="392.0" y="74" width="32" height="20" fill="#dc2626" rx="10"/><text x="408.0" y="84" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">注入</text><line x1="426.0" y1="163" x2="442.0" y2="163" stroke="#dc2626" stroke-width="2.2"/><polygon points="442.0,163 433.0,158.1 433.0,167.9" fill="#dc2626"/><rect x="444.0" y="100" width="166" height="126" fill="#7c3aed" rx="10" fill-opacity="0.07"/><rect x="444.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="444.0" y="100" width="166" height="4" fill="#7c3aed" rx="2"/><text x="527.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">auth.fingerprint</text><text x="527.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">复制指纹</text><text x="527.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">CFO/IQ/RSSI 一致</text><rect x="578.0" y="74" width="32" height="20" fill="#dc2626" rx="10"/><text x="594.0" y="84" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">注入</text><line x1="612.0" y1="163" x2="628.0" y2="163" stroke="#dc2626" stroke-width="2.2"/><polygon points="628.0,163 619.0,158.1 619.0,167.9" fill="#dc2626"/><rect x="630.0" y="100" width="166" height="126" fill="#2563eb" rx="10" fill-opacity="0.07"/><rect x="630.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="630.0" y="100" width="166" height="4" fill="#2563eb" rx="2"/><text x="713.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">v2x.cam</text><text x="713.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">伪名发消息</text><text x="713.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">位置 +45 m / +8 m</text><rect x="764.0" y="74" width="32" height="20" fill="#dc2626" rx="10"/><text x="780.0" y="84" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">注入</text><line x1="798.0" y1="163" x2="814.0" y2="163" stroke="#94a3b8" stroke-width="1.6"/><polygon points="814.0,163 805.0,158.1 805.0,167.9" fill="#94a3b8"/><rect x="816.0" y="100" width="166" height="126" fill="#059669" rx="10" fill-opacity="0.07"/><rect x="816.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#059669" stroke-width="1.6"/><rect x="816.0" y="100" width="166" height="4" fill="#059669" rx="2"/><text x="899.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">位置一致性</text><text x="899.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">1 s 内跳变 45 m</text><text x="899.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">同一伪名两处</text><line x1="984.0" y1="163" x2="1000.0" y2="163" stroke="#94a3b8" stroke-width="1.6"/><polygon points="1000.0,163 991.0,158.1 991.0,167.9" fill="#94a3b8"/><rect x="1002.0" y="100" width="166" height="126" fill="#059669" rx="10" fill-opacity="0.07"/><rect x="1002.0" y="100" width="166" height="126" fill="none" rx="10" stroke="#059669" stroke-width="1.6"/><rect x="1002.0" y="100" width="166" height="4" fill="#059669" rx="2"/><text x="1085.0" y="126.0" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="bold"  dominant-baseline="middle">认证 / 定位</text><text x="1085.0" y="154.25" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">CAM vs GNSS 不符</text><text x="1085.0" y="170.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">&gt; 12 m</text><text x="40" y="270" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold"  dominant-baseline="middle">可观测证据</text><rect x="140" y="258" width="133.94" height="24" fill="#1d4ed8" rx="12" fill-opacity="0.1"/><rect x="140" y="258" width="133.94" height="24" fill="none" rx="12" stroke="#1d4ed8" stroke-width="1"/><text x="206.97" y="270" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">cam_position_jump</text><rect x="283.94" y="258" width="133.94" height="24" fill="#1d4ed8" rx="12" fill-opacity="0.1"/><rect x="283.94" y="258" width="133.94" height="24" fill="none" rx="12" stroke="#1d4ed8" stroke-width="1"/><text x="350.90999999999997" y="270" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">cam_gnss_mismatch</text><text x="40" y="312" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold"  dominant-baseline="middle">包络判据</text><rect x="140" y="300" width="133.94" height="24" fill="#b45309" rx="12" fill-opacity="0.1"/><rect x="140" y="300" width="133.94" height="24" fill="none" rx="12" stroke="#b45309" stroke-width="1"/><text x="206.97" y="312" font-size="11" fill="#b45309" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">spoof_rate ≥ 2 Hz</text><text x="40" y="358" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold"  dominant-baseline="middle">检测规则</text><text x="140" y="358" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal"  dominant-baseline="middle">同一伪名 1 s 内 &gt;25 m 跳变 → 位置规则；CAM 与 GNSS 相差 &gt;12 m → 双源规则。</text></svg>