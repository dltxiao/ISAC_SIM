nt-size="10.5" fill="#3730a3" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">控制指令</text><rect x="960" y="410" width="132" height="34" fill="#ecfdf5" rx="8" stroke="#a7f3d0" stroke-width="1.2"/><text x="1026.0" y="427" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">TTC / 前车</text><line x1="804" y1="427" x2="956" y2="427" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/><polygon points="956,427 947.0,422.1 947.0,431.9" fill="#64748b"/><line x1="956" y1="427" x2="804" y2="427" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/><polygon points="804,427 813.0,431.9 813.0,422.1" fill="#64748b"/><text x="820" y="462" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" dominant-baseline="middle">brake_without_hazard</text><rect x="680" y="480" width="118" height="34" fill="#eef2ff" rx="8" stroke="#c7d2fe" stroke-width="1.2"/><text x="739.0" y="497" font-size="10.5" fill="#3730a3" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">CBR / PER</text><rect x="960" y="480" width="132" height="34" fill="#ecfdf5" rx="8" stroke="#a7f3d0" stroke-width="1.2"/><text x="1026.0" y="497" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="normal"  dominant-baseline="middle">申报负载</text><line x1="804" y1="497" x2="956" y2="497" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/><polygon points="956,497 947.0,492.1 947.0,501.9" fill="#64748b"/><line x1="956" y1="497" x2="804" y2="497" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/><polygon points="804,497 813.0,501.9 813.0,492.1" fill="#64748b"/><text x="820" y="532" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" dominant-baseline="middle">cbr_spike / link_degraded</text><rect x="80" y="590" width="1080" height="110" fill="#f8fafc" rx="10" stroke="#e5e7eb" stroke-width="1.2"/><text x="104" y="620" font-size="13" fill="#334155" text-anchor="start" font-weight="bold"  dominant-baseline="middle">统一范式</text><text x="104" y="648" font-size="11.5" fill="#475569" text-anchor="start" font-weight="normal"  dominant-baseline="middle">一个攻击事件 = 一个实体在至少两个域留下互相矛盾的观测；检测 = 把这些观测对齐到同一实体/同一时间窗，再判断矛盾是否可解释。</text><text x="104" y="678" font-size="11.5" fill="#475569" text-anchor="start" font-weight="normal"  dominant-baseline="middle">例：A3 的"回波 vs 点迹 vs 目标列表"、A4 的"伪名位置 vs GNSS"、A2 的"制动指令 vs 前车 TTC"，都是同一实体两条观测的对账。</text></svg>